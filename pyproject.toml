[project]
name = "csv-duck-dbt-fun"
version = "0.1.0"
description = "Excel/gSheet to Excel data pipeline with duckdb/dbt"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "duckdb==1.5.2",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "poethepoet>=0.34.0",
    "pre-commit>=4.2.0",
    "mypy>=1.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    # "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    # "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long — handled by ruff-format
]

[tool.ruff.lint.isort]
known-first-party = ["csv_duck_dbt_fun"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
exclude = ["dbt-module/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poe.env]
DBT_PROFILES_DIR = "${POE_ROOT}/.dbt"

[tool.poe.tasks.auth]
help = "One-time Google Sheets OAuth setup"
cmd  = "python setup_gsheets.py"

[tool.poe.tasks.seed]
help = "Load seed tables (dim_size, dim_category)"
cmd  = "dbt seed"
cwd  = "dbt-module/csv_fun"

[tool.poe.tasks.run]
help = "Build all dbt models"
cmd  = "dbt run"
cwd  = "dbt-module/csv_fun"

[tool.poe.tasks.test]
help = "Run all dbt tests"
cmd  = "dbt test"
cwd  = "dbt-module/csv_fun"

[tool.poe.tasks.build]
help = "Full pipeline: seed + run + test"
cmd  = "dbt build"
cwd  = "dbt-module/csv_fun"

[tool.poe.tasks.balance]
help = "Print current inventory balance (dev)"
cmd  = "python show_balance.py"

[tool.poe.tasks.balance-prod]
help = "Print current inventory balance (prod)"
cmd  = "python show_balance.py --env prod"

[tool.poe.tasks.mypy]
help = "Type-check all Python files"
cmd  = "mypy ."

[tool.poe.tasks.lint]
help     = "Lint, format, and type-check all Python files"
sequence = [
    { cmd = "ruff check --fix ." },
    { cmd = "ruff format ." },
    { ref = "mypy" },
]

[tool.poe.tasks.regular-build]
help     = "Auth, full pipeline build, then show prod balance"
sequence = ["auth", "build", "balance-prod"]
