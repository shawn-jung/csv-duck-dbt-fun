version: 2

models:
  - name: f_sales
    description: In-person orders fact table. Negative qty rows are returns.
    config:
      contract:
        enforced: true
    columns:
      - name: date_event
        description: Date of the transaction.
        data_type: varchar
        data_tests:
          - not_null
      - name: customer_name
        description: Customer name.
        data_type: varchar
      - name: category
        description: Item category.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Youth', 'WomenVneck', 'AdultUnisex', 'Hoodie', 'YouthHoodie']
      - name: size
        description: Normalised item size.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['XS', 'S', 'M', 'L', 'XL', '2XL']
      - name: qty
        description: Quantity sold. Negative values indicate a return.
        data_type: integer
        data_tests:
          - not_null
      - name: is_return
        description: True if qty is negative (return), false otherwise (sale).
        data_type: boolean
        data_tests:
          - not_null
      - name: sale_type
        description: the source of sales (such as in-person or cart sales)
        data_type: varchar

  - name: f_inventory_baseline
    description: Union of all raw inventory sources into a single baseline fact table.
    config:
      contract:
        enforced: true
    columns:
      - name: category
        description: Item category.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Youth', 'WomenVneck', 'AdultUnisex', 'Hoodie', 'YouthHoodie']
      - name: size
        description: Normalised item size.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['XS', 'S', 'M', 'L', 'XL', '2XL']
      - name: qty
        description: Quantity on hand.
        data_type: integer
        data_tests:
          - not_null
